
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtMimic Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Patrick Hand', 'Inter', sans-serif;
        background-color: #fef9c3; /* Yellow 100 */
        color: #334155; /* Slate 700 */
        background-image: radial-gradient(#fde047 2px, transparent 2px);
        background-size: 30px 30px;
        overflow-x: hidden;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .handdrawn-border {
        border: 3px solid #334155;
        border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        box-shadow: 4px 4px 0px #334155;
        background-color: #ffffff;
      }
      .handdrawn-button {
        border: 2px solid #334155;
        border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        box-shadow: 2px 2px 0px #334155;
        transition: all 0.2s;
      }
      .handdrawn-button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px #334155;
      }
      .handdrawn-button:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px #334155;
      }
      
      /* Floating motifs */
      .floating-motif {
        position: fixed;
        z-index: -1;
        opacity: 0.6;
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      /* Custom scrollbar for the console */
      .console-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .console-scroll::-webkit-scrollbar-track {
        background: #fef08a; 
      }
      .console-scroll::-webkit-scrollbar-thumb {
        background: #facc15; 
        border-radius: 4px;
      }
    </style>
